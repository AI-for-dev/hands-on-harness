<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">parada humana : una pregunta a la persona, una bifurcación según su respuesta</title>
  <desc id="d">Sin nadie ante la pantalla, la tarjeta toma su default:; aquí, no se hace commit.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" fill="none" stroke="#5e5646" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" fill="none" stroke="#e3846f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="379" rx="16" fill="#211e19" stroke="#332e26"/>
  <text x="40" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="1.4" fill="#a89e8e" text-anchor="start" dominant-baseline="middle">PATRÓN</text>
  <text x="760" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="1.4" fill="#a89e8e" text-anchor="end" dominant-baseline="middle">EN UN FLOW</text>
  <text x="760" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#ece6da" text-anchor="end" dominant-baseline="middle">ask → choice → commit</text>
  <text x="40" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="600" fill="#93b2e2" text-anchor="start" dominant-baseline="middle">parada humana</text>
  <text x="40" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="16" font-weight="400" fill="#ece6da" text-anchor="start" dominant-baseline="middle">una pregunta a la persona, una bifurcación según su respuesta</text>
  <rect x="40" y="193" width="70" height="34" rx="17" fill="#332e26"/><text x="75" y="211" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#ece6da" text-anchor="middle" dominant-baseline="middle">diff</text>
  <path d="M110 210 H134" fill="none" stroke="#5e5646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="140" y="184" width="150" height="52" rx="4" fill="#2a261f" stroke="#5e5646" stroke-width="1.5"/><text x="215" y="202" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#a89e8e" text-anchor="middle" dominant-baseline="middle">ASK</text><text x="215" y="219" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="15" font-weight="400" fill="#ece6da" text-anchor="middle" dominant-baseline="middle">¿Hacer commit?</text>
  <text x="215" y="254" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#a89e8e" text-anchor="middle" dominant-baseline="middle">default: false</text>
  <path d="M290 210 H312" fill="none" stroke="#5e5646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M350 174 L386 210 L350 246 L314 210 Z" fill="#2a261f" stroke="#5e5646" stroke-width="1.5" stroke-linejoin="round"/><text x="350" y="211" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#ece6da" text-anchor="middle" dominant-baseline="middle">yes ?</text>
  <text x="350" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#a89e8e" text-anchor="middle" dominant-baseline="middle">CHOICE</text>
  <path d="M386 210 H424" fill="none" stroke="#5e5646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <text x="402" y="198" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="12.5" font-weight="400" font-style="italic" fill="#a89e8e" text-anchor="middle" dominant-baseline="middle">sí</text>
  <rect x="430" y="184" width="120" height="52" rx="10" fill="#2a3242" stroke="#93b2e2" stroke-width="1.5"/><text x="490" y="202" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#93b2e2" text-anchor="middle" dominant-baseline="middle">AGENT</text><text x="490" y="219" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="15" font-weight="400" fill="#ece6da" text-anchor="middle" dominant-baseline="middle">committer</text>
  <path d="M550 210 H584" fill="none" stroke="#5e5646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="590" y="184" width="170" height="52" rx="4" fill="#2a261f" stroke="#5e5646" stroke-width="1.5"/><text x="675" y="202" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#a89e8e" text-anchor="middle" dominant-baseline="middle">COMMIT</text><text x="675" y="219" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#ece6da" text-anchor="middle" dominant-baseline="middle">combo/&lt;petición&gt;</text>
  <path d="M350 246 V294 H424" fill="none" stroke="#5e5646" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <text x="340" y="272" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="12.5" font-weight="400" font-style="italic" fill="#a89e8e" text-anchor="end" dominant-baseline="middle">no</text>
  <rect x="430" y="279" width="180" height="30" rx="15" fill="#332e26"/><text x="520" y="295" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="14" font-weight="400" fill="#ece6da" text-anchor="middle" dominant-baseline="middle">no se hace commit</text>
  <path d="M40 330 H760" fill="none" stroke="#5e5646" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="352" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="13.5" font-weight="400" font-style="italic" fill="#a89e8e" text-anchor="start" dominant-baseline="middle">Sin nadie ante la pantalla, la tarjeta toma su default:; aquí, no se hace commit.</text>
