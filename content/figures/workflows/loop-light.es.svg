  <text x="342" y="146" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="12.5" font-weight="400" font-style="italic" fill="#6f6557" text-anchor="middle" dominant-baseline="middle">no: el programador recibe la revisión y vuelve a empezar</text>
  <path d="M520 224 H584" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <text x="542" y="212" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="12.5" font-weight="400" font-style="italic" fill="#6f6557" text-anchor="middle" dominant-baseline="middle">sí</text>
  <rect x="590" y="207" width="170" height="34" rx="17" fill="#e8e0cd"/><text x="675" y="225" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">converged: true</text>
  <path d="M480 264 V300 H584" fill="none" stroke="#b0412c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#head-danger)"/>
  <text x="468" y="282" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="12.5" font-weight="400" font-style="italic" fill="#b0412c" text-anchor="end" dominant-baseline="middle">tope alcanzado</text>
  <rect x="590" y="283" width="170" height="34" rx="17" fill="none" stroke="#b0412c" stroke-width="1.2" stroke-dasharray="4 3"/><text x="675" y="301" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#b0412c" text-anchor="middle" dominant-baseline="middle">converged: false</text>
  <path d="M40 330 H760" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="352" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="13.5" font-weight="400" font-style="italic" fill="#6f6557" text-anchor="start" dominant-baseline="middle">Alcanzar max: hace fallar el bucle; con on-fail: continue, converged sigue en false.</text>
