<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">loop : 1 → 1 hasta una condición, con un tope de iteraciones</title>
  <desc id="d">Alcanzar max: hace fallar el bucle; con on-fail: continue, converged sigue en false.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" fill="none" stroke="#b9ad96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" fill="none" stroke="#b0412c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="379" rx="16" fill="#f2ede1" stroke="#e2d9c6"/>
  <text x="40" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="1.4" fill="#6f6557" text-anchor="start" dominant-baseline="middle">PATRÓN</text>
  <text x="760" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="1.4" fill="#6f6557" text-anchor="end" dominant-baseline="middle">EN UN FLOW</text>
  <text x="760" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#2b2620" text-anchor="end" dominant-baseline="middle">loop</text>
  <text x="40" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="600" fill="#34568b" text-anchor="start" dominant-baseline="middle">loop</text>
  <text x="40" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="16" font-weight="400" fill="#2b2620" text-anchor="start" dominant-baseline="middle">1 → 1 hasta una condición, con un tope de iteraciones</text>
  <rect x="40" y="207" width="76" height="34" rx="17" fill="#e8e0cd"/><text x="78" y="225" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="14" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">tarea</text>
  <path d="M116 224 H144" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="150" y="198" width="110" height="52" rx="10" fill="#e3e8f1" stroke="#34568b" stroke-width="1.5"/><text x="205" y="216" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#34568b" text-anchor="middle" dominant-baseline="middle">AGENT</text><text x="205" y="233" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="15" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">programador</text>
  <path d="M260 224 H284" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="290" y="198" width="110" height="52" rx="10" fill="#e3e8f1" stroke="#34568b" stroke-width="1.5"/><text x="345" y="216" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#34568b" text-anchor="middle" dominant-baseline="middle">AGENT</text><text x="345" y="233" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="15" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">revisor</text>
  <text x="275" y="268" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#6f6557" text-anchor="middle" dominant-baseline="middle">max: obligatorio</text>
  <path d="M400 224 H438" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M480 184 L520 224 L480 264 L440 224 Z" fill="#fffdf8" stroke="#b9ad96" stroke-width="1.5" stroke-linejoin="round"/><text x="480" y="225" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">¿listo?</text>
