<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">gate : decide la suite de tests, no la aprobación</title>
  <desc id="d">Mientras la suite esté en rojo, ninguna aprobación saca al bucle.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" fill="none" stroke="#b9ad96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5" fill="none" stroke="#b0412c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="379" rx="16" fill="#f2ede1" stroke="#e2d9c6"/>
  <text x="40" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="1.4" fill="#6f6557" text-anchor="start" dominant-baseline="middle">PATRÓN</text>
  <text x="760" y="40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" letter-spacing="1.4" fill="#6f6557" text-anchor="end" dominant-baseline="middle">EN UN FLOW</text>
  <text x="760" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#2b2620" text-anchor="end" dominant-baseline="middle">check dentro de un loop</text>
  <text x="40" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="600" fill="#34568b" text-anchor="start" dominant-baseline="middle">gate</text>
  <text x="40" y="100" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="16" font-weight="400" fill="#2b2620" text-anchor="start" dominant-baseline="middle">decide la suite de tests, no la aprobación</text>
  <rect x="40" y="201" width="70" height="34" rx="17" fill="#e8e0cd"/><text x="75" y="219" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="14" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">paso</text>
  <path d="M110 218 H130" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="136" y="192" width="100" height="52" rx="10" fill="#e3e8f1" stroke="#34568b" stroke-width="1.5"/><text x="186" y="210" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#34568b" text-anchor="middle" dominant-baseline="middle">AGENT</text><text x="186" y="227" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="15" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">coder</text>
  <path d="M236 218 H256" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="262" y="192" width="100" height="52" rx="4" fill="#fffdf8" stroke="#b9ad96" stroke-width="1.5"/><text x="312" y="210" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#6f6557" text-anchor="middle" dominant-baseline="middle">CHECK</text><text x="312" y="227" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">npm test</text>
  <path d="M362 218 H382" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="388" y="192" width="100" height="52" rx="10" fill="#e3e8f1" stroke="#34568b" stroke-width="1.5"/><text x="438" y="210" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="400" letter-spacing="1.2" fill="#34568b" text-anchor="middle" dominant-baseline="middle">AGENT</text><text x="438" y="227" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="15" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">reviewer</text>
  <path d="M488 218 H522" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M560 182 L596 218 L560 254 L524 218 Z" fill="#fffdf8" stroke="#b9ad96" stroke-width="1.5" stroke-linejoin="round"/><text x="560" y="219" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">¿listo?</text>
  <path d="M596 218 H620" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <text x="610" y="206" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="12.5" font-weight="400" font-style="italic" fill="#6f6557" text-anchor="middle" dominant-baseline="middle">sí</text>
  <rect x="626" y="201" width="134" height="34" rx="17" fill="#e8e0cd"/><text x="693" y="219" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="14" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">paso siguiente</text>
  <path d="M560 182 V152 H186 V186" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
  <text x="373" y="140" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="12.5" font-weight="400" font-style="italic" fill="#6f6557" text-anchor="middle" dominant-baseline="middle">no: nuevo intento, el programador lee la revisión</text>
  <rect x="257" y="251" width="110" height="26" rx="13" fill="none" stroke="#b0412c" stroke-width="1.2" stroke-dasharray="4 3"/><text x="312" y="265" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#b0412c" text-anchor="middle" dominant-baseline="middle">passed: false</text>
  <rect x="383" y="251" width="110" height="26" rx="13" fill="#e8e0cd"/><text x="438" y="265" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">approved: true</text>
  <text x="400" y="302" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#2b2620" text-anchor="middle" dominant-baseline="middle">loop: tests.output.passed &amp;&amp; review.output.approved</text>
  <path d="M40 330 H760" fill="none" stroke="#b9ad96" stroke-width="1.5" stroke-linecap="round"/>
  <text x="40" y="352" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="13.5" font-weight="400" font-style="italic" fill="#6f6557" text-anchor="start" dominant-baseline="middle">Mientras la suite esté en rojo, ninguna aprobación saca al bucle.</text>
</svg>
