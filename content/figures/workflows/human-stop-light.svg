  <text x="760" y="70" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#2b2620" text-anchor="end" dominant-baseline="middle">ask → choice → commit</text>
