<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">arrêt humain : une question à la personne, un branchement sur sa réponse</title>
  <desc id="d">Sans personne devant l’écran, la carte prend son default: ; ici, rien n’est commité.</desc>
