name: pre-commit

on:
  pull_request:
    branches: [main]

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The local hook "i18n-translations-up-to-date" uses `language:
      # system`: it runs `node scripts/i18n/translate.mjs --dry-run`
      # directly, which imports js-yaml from node_modules. Without Node and
      # `npm ci` before pre-commit, this hook would fail for the wrong
      # reason (missing dependency) instead of on a real translation gap.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Same steps as pre-commit/action, whose latest release (v3.0.1) still
      # depends on actions/cache@v4 (Node.js 20).
      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
