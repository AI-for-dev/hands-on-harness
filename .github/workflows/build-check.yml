name: Build check

# Checks that the VitePress site builds before merging into main. The
# actual GitHub Pages deployment (deploy.yml) only runs on push to main,
# once the PR is merged.
on:
  pull_request:
    branches: [main]

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache VitePress
        uses: actions/cache@v6
        with:
          path: .vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('content/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build
