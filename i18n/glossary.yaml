# Translation glossary
#
# This file is part of the "translation rules": any change to the terms below
# automatically invalidates the translations already generated (see
# manifest.json and scripts/i18n/lib/config.mjs), which will be regenerated on
# the next `npm run i18n:translate`. Comments are not part of the rules and can
# be reworded freely.
#
# Goal: guarantee that a technical term is ALWAYS translated the same way,
# whichever local model is used.
#
# The values below are injected into a French system prompt: the `note` fields
# are addressed to the model and stay in French.

# Proper nouns and product names never to translate, to be copied as is.
doNotTranslate:
  - VitePress
  - Ollama
  - Claude Code
  - Markdown
  - GitHub
  - Hands-on Harness

# Fixed translations for the technical vocabulary of the course.
# Extend this list as the need arises: every entry added reduces the variance
# between models.
terms:
  - fr: harnais
    en: harness
    es: harness
    note: >-
      Terme technique du cours (harnais d'agent/LLM), à ne pas traduire
      littéralement par "arnés" (harnais physique).
  - fr: invite système
    en: system prompt
    es: system prompt
  - fr: garde-fou
    en: guardrail
    es: barrera de seguridad
  - fr: modèle de langage
    en: language model
    es: modelo de lenguaje
